# Extrait de configuration Supabase CLI pour les fonctions de ce projet.
# Les fonctions "notify" et "announce" acceptent la clé publique (anon) ou une session staff.
# "reminders" est appelée par pg_cron sans jeton : elle vérifie elle-même l'en-tête x-cron-secret.

[functions.notify]
verify_jwt = true

[functions.announce]
verify_jwt = true

[functions.reminders]
verify_jwt = false
